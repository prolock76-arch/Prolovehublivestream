<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live · ProLoveHub</title>
<meta name="description" content="Watch creators live as 3D avatars on ProLoveHub." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   RESET
============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  background:#0A0A0F;color:#fff;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  height:100vh;overflow:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
ul{list-style:none}

:root{
  --pink:#FE2C55;--cyan:#25F4EE;--dark:#0A0A0F;--card:#14141C;
  --border:#1F1F2A;--muted:#9CA3AF;--dim:#6B7280;--green:#22C55E;
  --radius:12px;--radius-lg:16px;
  --sidebar:360px;--nav-h:60px;
}
.grad-text{
  background:linear-gradient(90deg,var(--pink),var(--cyan));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.dot-white{background:#fff}
.dot-cyan{background:var(--cyan)}
.pulse{animation:pulseLive 1.5s ease-in-out infinite}
@keyframes pulseLive{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* ============================================================
   TOPNAV
============================================================ */
.topnav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);
  background:rgba(10,10,15,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);z-index:50;
  display:flex;align-items:center;padding:0 20px;gap:16px;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--card);
  font-size:13px;font-weight:600;transition:all .2s;
}
.back-btn:hover{background:#1A1A24;border-color:#2A2A38}
.topnav-title{
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:10px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.live-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:5px;
  background:var(--pink);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.1em;
  flex-shrink:0;
}
.topnav-spacer{flex:1}
.topnav-user{
  display:none;align-items:center;gap:8px;
  padding:6px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);font-size:12px;
}
.topnav-user .dot{background:var(--cyan)}
.topnav-user .badge-mini{
  padding:2px 6px;border-radius:4px;
  background:var(--pink);font-size:9px;font-weight:800;
}
@media (min-width:640px){.topnav-user{display:inline-flex}}

/* ============================================================
   LAYOUT
============================================================ */
.layout{
  display:grid;grid-template-columns:1fr;
  height:calc(100vh - var(--nav-h));margin-top:var(--nav-h);
}
@media (min-width:1024px){
  .layout{grid-template-columns:1fr var(--sidebar)}
}

/* ============================================================
   STAGE
============================================================ */
.stage{
  position:relative;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.stage-feed{
  position:absolute;inset:0;
  background-size:200% 200%;
  animation:feedMove 12s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
}
@keyframes feedMove{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.stage-feed::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,transparent 30%,rgba(0,0,0,.5) 100%);
  pointer-events:none;
}
.avatar-stage{position:relative;z-index:2;text-align:center}
.avatar-big{
  font-size:140px;line-height:1;
  filter:drop-shadow(0 0 40px rgba(254,44,85,.7));
  animation:avatarBob 3s ease-in-out infinite;
}
@keyframes avatarBob{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-12px) rotate(1deg)}
}
.avatar-tagline{
  font-size:11px;letter-spacing:.3em;
  color:rgba(255,255,255,.6);margin-top:8px;
}

.stage-top{
  position:absolute;top:16px;left:16px;right:16px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.stage-host{
  display:flex;align-items:center;gap:10px;
  padding:6px 12px 6px 6px;border-radius:999px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
}
.host-avatar{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12px;color:#0A0A0F;
  border:2px solid var(--pink);
  flex-shrink:0;
}
.host-meta{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.host-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host-followers{font-size:10px;color:var(--muted);white-space:nowrap}
.stage-badges{display:flex;align-items:center;gap:8px;flex-shrink:0}
.live-pill-lg{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:6px;
  background:var(--pink);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.1em;
}
.view-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:6px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  font-size:11px;font-weight:600;
}

/* Locked */
.locked-stage{
  position:absolute;inset:0;
  background:rgba(10,10,15,.92);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;
  text-align:center;padding:40px 24px;z-index:10;
}
.locked-stage.show{display:flex}
.locked-inner{max-width:420px}
.locked-icon{
  font-size:64px;margin-bottom:16px;
  filter:drop-shadow(0 0 30px rgba(254,44,85,.6));
}
.locked-title{
  font-size:24px;font-weight:800;
  letter-spacing:-.02em;margin-bottom:10px;
}
.locked-sub{
  font-size:14px;color:var(--muted);
  margin-bottom:24px;line-height:1.6;
}
.locked-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Bottom controls */
.stage-controls{
  position:absolute;bottom:16px;left:16px;right:16px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;
}
.reactions{display:flex;gap:8px}
.reaction-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .2s;
}
.reaction-btn:hover{background:rgba(254,44,85,.4);transform:scale(1.1)}
.reaction-btn:active{transform:scale(.95)}
.controls-right{display:flex;gap:8px}
.ctrl-btn{
  padding:8px 14px;border-radius:10px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
  font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .2s;
}
.ctrl-btn:hover{background:rgba(255,255,255,.1)}

/* Floating reactions */
.float-layer{
  position:absolute;inset:0;pointer-events:none;
  overflow:hidden;z-index:4;
}
.float-emoji{
  position:absolute;bottom:80px;font-size:28px;
  animation:floatUp 3s ease-out forwards;
  pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
}
@keyframes floatUp{
  0%{transform:translateY(0) scale(.6);opacity:0}
  15%{opacity:1;transform:translateY(-20px) scale(1.1)}
  100%{transform:translateY(-400px) scale(.9);opacity:0}
}

/* ============================================================
   SIDEBAR
============================================================ */
.sidebar{
  background:#0F0F15;border-left:1px solid var(--border);
  display:flex;flex-direction:column;height:100%;overflow:hidden;
}
@media (max-width:1023px){
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;
    height:55vh;border-left:none;border-top:1px solid var(--border);
    transform:translateY(100%);transition:transform .3s ease;
    z-index:20;
    border-top-left-radius:20px;border-top-right-radius:20px;
  }
  .sidebar.open{transform:translateY(0)}
}
.sidebar-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.sidebar-title{
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.sidebar-sub{font-size:11px;color:var(--muted);margin-top:2px}
.sub-pill{
  display:inline-flex;padding:3px 8px;border-radius:5px;
  background:linear-gradient(90deg,rgba(254,44,85,.2),rgba(37,244,238,.2));
  border:1px solid rgba(37,244,238,.4);
  color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.05em;
}
.sidebar-close{
  display:none;padding:6px;border-radius:8px;
  background:var(--card);font-size:14px;
}
@media (max-width:1023px){.sidebar-close{display:flex}}

/* Chat */
.chat-scroll{
  flex:1;overflow-y:auto;padding:12px 16px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
.chat-scroll::-webkit-scrollbar{width:6px}
.chat-scroll::-webkit-scrollbar-track{background:transparent}
.chat-scroll::-webkit-scrollbar-thumb{background:#22222C;border-radius:6px}

.msg{
  display:flex;align-items:flex-start;gap:8px;
  font-size:13px;line-height:1.45;
  animation:msgIn .25s ease-out;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.msg-badge{
  flex-shrink:0;margin-top:2px;
  padding:2px 5px;border-radius:4px;
  font-size:9px;font-weight:800;line-height:1;
}
.msg-badge.pink{background:var(--pink);color:#fff}
.msg-badge.cyan{background:var(--cyan);color:#0A0A0F}
.msg-badge.host{background:linear-gradient(135deg,var(--pink),var(--cyan));color:#fff}

.msg-body{min-width:0}
.msg-user{font-weight:700;margin-right:4px}
.msg-user.cyan{color:var(--cyan)}
.msg-user.pink{color:var(--pink)}
.msg-user.host{color:#FFB4C2}
.msg-user.normal{color:#E5E7EB}
.msg-text{color:#D1D5DB;word-wrap:break-word}

.msg-host{
  background:linear-gradient(90deg,rgba(254,44,85,.12),rgba(37,244,238,.12));
  border:1px solid rgba(37,244,238,.25);
  border-radius:10px;padding:8px 12px;
}

.chat-scroll.locked{
  filter:blur(5px);pointer-events:none;user-select:none;position:relative;
}

/* Chat input */
.chat-input-wrap{
  padding:12px 16px;border-top:1px solid var(--border);
  background:#0A0A0F;
}
.chat-input{
  display:flex;align-items:center;gap:8px;
  padding:4px 4px 4px 14px;
  background:var(--card);border:1px solid var(--border);
  border-radius:999px;transition:all .2s;
}
.chat-input:focus-within{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(37,244,238,.1);
}
.chat-input input{
  flex:1;background:transparent;border:none;outline:none;
  color:#fff;font-size:13px;padding:8px 0;
}
.chat-input input::placeholder{color:var(--dim)}
.chat-send{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;transition:transform .2s;
}
.chat-send:hover{transform:scale(1.08)}
.chat-send:disabled{opacity:.4;cursor:not-allowed;transform:none}

.chat-locked-note{
  display:none;padding:8px 12px;border-radius:10px;
  background:rgba(254,44,85,.08);
  border:1px solid rgba(254,44,85,.3);
  color:#FF8099;font-size:12px;text-align:center;
  margin-bottom:10px;
}
.chat-locked-note.show{display:block}

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:var(--radius);
  font-weight:600;font-size:14px;transition:all .2s ease;
  white-space:nowrap;line-height:1;
}
.btn-primary{background:linear-gradient(90deg,var(--pink),var(--cyan));color:#fff;font-weight:700}
.btn-primary:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{border:1px solid var(--border);background:rgba(20,20,28,.6);color:#fff}
.btn-ghost:hover{background:var(--card)}
.btn-lg{padding:14px 24px;font-size:15px}

/* ============================================================
   TOAST / MOBILE / LOADING
============================================================ */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(120%);
  padding:12px 20px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--border);
  font-size:13px;font-weight:600;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  transition:transform .3s ease;z-index:200;
  max-width:calc(100vw - 32px);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(34,197,94,.5);color:#86EFAC}
.toast.error{border-color:rgba(254,44,85,.5);color:#FF8099}

.mobile-chat-toggle{
  display:none;position:fixed;bottom:20px;right:20px;z-index:30;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--cyan));
  align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 8px 24px rgba(254,44,85,.4);
}
@media (max-width:1023px){.mobile-chat-toggle{display:flex}}

.loading{
  position:fixed;inset:0;background:var(--dark);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:14px;z-index:500;
  transition:opacity .3s;flex-direction:column;gap:12px;
}
.loading.hide{opacity:0;pointer-events:none}
.spinner{
  width:22px;height:22px;
  border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--cyan);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

</div>

<header class="topnav">
  <a href="index.html" class="back-btn">← Exit</a>
  <div class="topnav-title">

<button class="mobile-chat-toggle" onclick="toggleSidebar()" aria-label="Toggle chat">💬</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* ============================================================
   ProLoveHub — Live Room (Supabase-backed)
============================================================ */

const SUPABASE_URL = "https://apwyqkxyglfcmooqedsk.supabase.co";
const SUPABASE_KEY = "sb_publishable_YuAnouzmvWgxJLhmazjiIg_K8utDLRz";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- Demo auto-chat pool ----
const AUTO_MSGS = [
  "this is so cool 🔥","how long have you been live?","the avatar moved! 😱",
  "hi from kenya 🇰🇪","chat so fast today","members-only is 🔥🔥",
  "greetings from Brazil","watching from class 😂","🔥🔥🔥🔥🔥",
  "who else is here rn?","the vibes are unmatched","please play that again!",
  "omg the dance move 😭","first time here, subbed",
];
const NAMES = ["zeus","kim","alia","noah","sora","reya","tag","luca","ivy","kai_2","nova","mira","rook"];
const STYLES = ["cyan","pink","normal"];

// ---- State ----
let creator = null;
let currentUser = null;
let isMember = false;
let access = { ok: false, reason: "loading" };
let chatInterval = null;
let reactionInterval = null;

// ---- Helpers ----
function getHandle() {
  const params = new URLSearchParams(window.location.search);
  return params.get("handle") || "kaijudances";
}

let toastTimer;
function toast(msg, type="success") {
  const el = document.getElementById("toast");
  el.textContent = (type==="success" ? "✓ " : "⚠ ") + msg;
  el.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

// ============================================================
// LOAD CREATOR
// ============================================================
async function loadCreator() {
  const handle = getHandle();
  const { data, error } = await sb
    .from("creators")
    .select("*")
    .eq("handle", handle)
    .maybeSingle();

  if (error || !data) {
    toast("Creator not found", "error");
    return null;
  }
  return data;
}

// ============================================================
// LOAD USER + MEMBERSHIP
// ============================================================
async function loadUserAndMembership() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;

  if (!currentUser) {
    isMember = false;
    return;
  }

  const { data: m } = await sb
    .from("memberships")
    .select("id")
    .eq("user_id", currentUser.id)
    .eq("creator_id", creator.id)
    .eq("status", "active")
    .maybeSingle();

  isMember = !!m;
}

// ============================================================
// COMPUTE ACCESS
// ============================================================
function computeAccess() {
  if (!creator.is_live) return { ok: false, reason: "offline" };
  if (!currentUser)     return { ok: false, reason: "login" };
  if (creator.is_members_only && !isMember) return { ok: false, reason: "member" };
  return { ok: true };
}

// ============================================================
// RENDER
// ============================================================
function render() {
  document.title = `${creator.name} · Live · ProLoveHub`;

  // Nav
  document.getElementById("navTitle").textContent =
    (creator.name) + " · @" + creator.handle;

  // Host
  const hostAv = document.getElementById("hostAvatar");
  hostAv.style.background = creator.gradient || "linear-gradient(135deg, #FE2C55, #A855F7)";
  hostAv.textContent = creator.initials || creator.name.slice(0,2).toUpperCase();
  document.getElementById("hostName").textContent = creator.name;
  document.getElementById("hostFollowers").textContent = (creator.streams * 60 || 0).toLocaleString() + " members";
  document.getElementById("viewPill").textContent = "👁 " +
    ((creator.viewers || 0) >= 1000 ? ((creator.viewers/1000).toFixed(1)+"K") : (creator.viewers || 0));

  // Stage
  document.getElementById("stageFeed").style.background =
    creator.gradient || "linear-gradient(135deg, #FE2C55, #A855F7)";

  // Top-right user pill
  if (currentUser) {
    document.getElementById("navUser").style.display = "inline-flex";
    const uname = currentUser.user_metadata?.username || currentUser.email?.split("@")[0] || "user";
    document.getElementById("navUserName").textContent = uname;
    document.getElementById("navUserBadge").style.display = isMember ? "inline-block" : "none";
  }

  // Chat sub
  document.getElementById("chatSub").textContent =
    ((creator.viewers || 0).toLocaleString()) + " watching";

  // Chat mode pill
  const pill = document.getElementById("chatModePill");
  if (creator.is_members_only) {
    pill.textContent = "MEMBERS ONLY";
  } else {
    pill.textContent = "OPEN CHAT";
    pill.style.background = "rgba(255,255,255,0.05)";
    pill.style.borderColor = "var(--border)";
    pill.style.color = "#D1D5DB";
  }

  // Chat population
  populateChat();

  // Apply access
  access = computeAccess();
  applyAccess();
}

// ============================================================
// CHAT
// ============================================================
function populateChat() {
  const scroll = document.getElementById("chatScroll");
  scroll.innerHTML = "";

  addMsg({ user: creator.name, style: "host", badge: "host", text: "welcome in everyone 🙌", host: true });
  addMsg({ user: "mia_22", style: "cyan", badge: "pink", text: "this avatar 😭" });
  addMsg({ user: "dvn", style: "pink", badge: "cyan", text: "free to join is wild" });

  if (chatInterval) clearInterval(chatInterval);
  chatInterval = setInterval(() => {
    if (!access.ok) return;
    const pick = AUTO_MSGS[Math.floor(Math.random() * AUTO_MSGS.length)];
    const name = NAMES[Math.floor(Math.random() * NAMES.length)];
    const style = STYLES[Math.floor(Math.random() * STYLES.length)];
    const badge = Math.random() > 0.5 ? "pink" : "cyan";
    addMsg({ user: name, style, badge, text: pick });
  }, 2800);
}

function addMsg({ user, style="normal", badge="pink", text, host=false }) {
  const scroll = document.getElementById("chatScroll");
  if (!scroll) return;
  const div = document.createElement("div");
  div.className = "msg" + (host ? " msg-host" : "");
  div.innerHTML = `
    <span class="msg-badge ${badge}">${host ? "HOST" : "🏅"}</span>
    <div class="msg-body">
      <span class="msg-user ${style}">${escapeHtml(user)}</span>
      <span class="msg-text">${escapeHtml(text)}</span>
    </div>
  `;
  scroll.appendChild(div);
  while (scroll.children.length > 80) scroll.removeChild(scroll.firstChild);
  scroll.scrollTop = scroll.scrollHeight;
}

// ============================================================
// ACCESS STATE
// ============================================================
function applyAccess() {
  const lockedStage = document.getElementById("lockedStage");
  const chatScroll  = document.getElementById("chatScroll");
  const chatNote    = document.getElementById("chatLockedNote");
  const chatInput   = document.getElementById("chatInput");
  const chatSend    = document.getElementById("chatSend");
  const lockIcon    = document.getElementById("lockedIcon");
  const lockTitle   = document.getElementById("lockedTitle");
  const lockSub     = document.getElementById("lockedSub");
  const lockBtn     = document.getElementById("lockPrimaryBtn");
  const livePill    = document.getElementById("stageLivePill");

  if (access.ok) {
    lockedStage.classList.remove("show");
    chatScroll.classList.remove("locked");
    chatNote.classList.remove("show");
    chatInput.disabled = false;
    chatSend.disabled = false;
    chatInput.placeholder = "Send a message…";
  } else {
    lockedStage.classList.add("show");
    chatScroll.classList.add("locked");
    chatNote.classList.add("show");
    chatInput.disabled = true;
    chatSend.disabled = true;
    chatInput.placeholder = "Chat locked";

    if (access.reason === "login") {
      lockIcon.textContent = "🔐";
      lockTitle.textContent = "Log in to watch";
      lockSub.textContent = "Create a free account to join members-only rooms and chats.";
      lockBtn.textContent = "🔑 Log in / Sign up";
      lockBtn.onclick = () => { window.location.href = "login.html"; };
    } else if (access.reason === "member") {
      lockIcon.textContent = "🔒";
      lockTitle.textContent = "Members only";
      lockSub.textContent = `Join @${creator.handle} free to unlock this room and every members-only live.`;
      lockBtn.textContent = "⭐ Join Free";
      lockBtn.onclick = handleJoinFromLock;
    } else if (access.reason === "offline") {
      lockIcon.textContent = "💤";
      lockTitle.textContent = "Stream ended";
      lockSub.textContent = `${creator.name} is offline right now.`;
      lockBtn.textContent = "🔔 Notify me";
      lockBtn.onclick = () => toast("You'll be notified when they go live", "success");
      livePill.style.background = "rgba(255,255,255,0.1)";
      livePill.innerHTML = "OFFLINE";
    }
  }
}

// ============================================================
// JOIN FROM LOCK SCREEN
// ============================================================
async function handleJoinFromLock() {
  if (!currentUser) {
    window.location.href = "login.html";
    return;
  }

  const btn = document.getElementById("lockPrimaryBtn");
  btn.disabled = true;
  btn.textContent = "Joining…";

  try {
    const { error } = await sb.from("memberships").insert({
      user_id: currentUser.id,
      creator_id: creator.id,
      status: "active",
    });

    if (error && error.code !== "23505") throw error;

    isMember = true;
    access = computeAccess();
    applyAccess();
    toast(`Joined ${creator.name}! 🎉`);

    // Log activity
    sb.from("activity").insert({
      icon: "🏅",
      text: `<strong>${escapeHtml(currentUser.email?.split("@")[0] || "user")}</strong> joined <strong>${escapeHtml(creator.handle)}</strong>`,
    }).then(() => {}).catch(() => {});
  } catch (err) {
    console.error(err);
    toast("Could not join: " + (err.message || "unknown error"), "error");
    btn.disabled = false;
    btn.textContent = "⭐ Join Free";
  }
}

// ============================================================
// CHAT SEND
// ============================================================
document.getElementById("chatForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!access.ok) return;
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;

  const uname = currentUser?.user_metadata?.username
    || currentUser?.email?.split("@")[0]
    || "you";

  addMsg({ user: uname, style: "host", badge: "host", text });
  input.value = "";
});

// ============================================================
// REACTIONS
// ============================================================
function sendReaction(emoji) {
  const layer = document.getElementById("floatLayer");
  const el = document.createElement("span");
  el.className = "float-emoji";
  el.textContent = emoji;
  el.style.left = (Math.random() * 60 + 20) + "%";
  el.style.fontSize = (Math.random() * 14 + 24) + "px";
  layer.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function startAmbientReactions() {
  if (reactionInterval) clearInterval(reactionInterval);
  reactionInterval = setInterval(() => {
    if (!access.ok) return;
    const emojis = ["❤️","🔥","😂","😮","💖","✨"];
    sendReaction(emojis[Math.floor(Math.random() * emojis.length)]);
  }, 2200);
}

// ============================================================
// MOBILE
// ============================================================
function toggleSidebar(force) {
  const s = document.getElementById("sidebar");
  const open = typeof force === "boolean" ? force : !s.classList.contains("open");
  s.classList.toggle("open", open);
}

// ============================================================
// SHARE
// ============================================================
function shareRoom() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: creator.name + " is live on ProLoveHub", url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => toast("Link copied!")).catch(() => {});
  }
}

// ============================================================
// BOOT
// ============================================================
async function boot() {
  creator = await loadCreator();
  if (!creator) {
    setTimeout(() => window.location.href = "index.html", 1200);
    return;
  }

  await loadUserAndMembership();
  render();
  startAmbientReactions();

  document.getElementById("loading").classList.add("hide");

  // Watch auth state
  sb.auth.onAuthStateChange(async () => {
    await loadUserAndMembership();
    render();
  });
}

boot();
</script>
